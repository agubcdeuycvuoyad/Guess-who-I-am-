body {

}

}

}

input {

}

button {

}

button:hover {

}

button:active {

.hidden {

}

#message {

}

@media(max-width:600px) {

}
</style>
</head>

/* =====================================================
   GAME VARIABLES
===================================================== */

let currentPerson = null;
let score = 0;
let streak = 0;
let lives = 3;
let round = 0;
let clueNumber = 0;
let answered = false;


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    score = 0;
    streak = 0;
    lives = 3;
    round = 0;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    updateStats();

    nextRound();
}


/* =====================================================
   NEXT ROUND
===================================================== */

function nextRound() {

    if (round >= 10) {
        endGame();
        return;
    }

    round++;

    clueNumber = 0;
    answered = false;

    document.getElementById("answer").value = "";
    document.getElementById("answer").disabled = false;

    document.getElementById("message")
        .textContent = "";

    document.getElementById("nextButton")
        .classList.add("hidden");

    currentPerson =
        people[Math.floor(Math.random() * people.length)];

    document.getElementById("category")
        .textContent = currentPerson.category;

    document.getElementById("clues")
        .innerHTML = "";

    showClue();

    updateStats();

    document.getElementById("answer").focus();
}


/* =====================================================
   SHOW NEXT CLUE
===================================================== */

function showClue() {

    if (clueNumber >= 5) {
        return;
    }

    const clue = document.createElement("div");

    clue.className = "clue";

    clue.textContent =
        "🧩 Clue " +
        (clueNumber + 1) +
        ": " +
        currentPerson.clues[clueNumber];

    document.getElementById("clues")
        .appendChild(clue);

    clueNumber++;
}


/* =====================================================
   GUESS
===================================================== */

function guess() {

    if (answered) {
        return;
    }

    const input =
        document.getElementById("answer");

    const userAnswer =
        input.value.trim().toLowerCase();

    if (userAnswer === "") {

        document.getElementById("message")
            .textContent = "Type your answer first!";

        return;
    }

    const correct =
        currentPerson.name.toLowerCase();

    if (
        userAnswer === correct ||
        correct.includes(userAnswer)
    ) {

        answered = true;

        let points;

        if (clueNumber === 1) {
            points = 500;
        } else if (clueNumber === 2) {
            points = 400;
        } else if (clueNumber === 3) {
            points = 300;
        } else if (clueNumber === 4) {
            points = 200;
        } else {
            points = 100;
        }

        const streakBonus = streak * 50;

        const total = points + streakBonus;

        score += total;

        streak++;

        document.getElementById("message")
            .textContent =
            "🔥 CORRECT! +" + total + " points!";

        input.disabled = true;

        document.getElementById("nextButton")
            .classList.remove("hidden");

        updateStats();

    } else {

        lives--;

        streak = 0;

        document.getElementById("message")
            .textContent =
            "❌ Wrong! Try again.";

        updateStats();

        if (lives <= 0) {
            endGame();
        }
    }
}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("streak")
        .textContent = streak;

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("round")
        .textContent = round;
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .classList.remove("hidden");

    let best =
        Number(localStorage.getItem("whoAmIBest")) || 0;

    if (score > best) {
        best = score;
        localStorage.setItem("whoAmIBest", best);
    }

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("bestScore")
        .textContent = best;
}


/* =====================================================
   ENTER KEY
===================================================== */

document.getElementById("answer")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        guess();
    }

});

</script>
